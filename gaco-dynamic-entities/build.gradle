ext {
    kibuModules = [
            'kibu-hook-api',
            'kibu-hooks',
            'kibu-scheduler-api',
            'kibu-translation-api',
    ]
    gacoModules = [
            'gaco-ds',
    ]
}

publishing {
    publications {
        named("mavenJava", MavenPublication) {
            pom {
                name = 'gaco-dynamic-entities'
                description = "API for dynamic entities, that don't exist physically in the world."
            }
        }
    }
}