import work.lclpnet.build.task.GithubDeploymentTask

plugins {
	id 'fabric-loom' version "${loom_version}" apply false
	id 'gradle-build-utils' version '1.7.0'
    id "io.freefair.lombok" version "8.11"
}

static def substitutions(Project project) {
    return [
            version          : project.version,
            loader_version   : project.loader_version,
            minecraft_version: project.minecraft_version,
            java_version     : project.java_version
    ]
}

def env = System.getenv()
Properties props = buildUtils.loadProperties('publish.properties')  // will be empty, if the file is missing

boolean local = System.getProperty("build.local") == "true"
def versionSuffix = (local ? '+local' : '')

version = "${project.mod_version}+${project.minecraft_version}${versionSuffix}"

ext {
    projectKibuModules = new LinkedHashMap<String, List<String>>()
    projectGacoModules = new LinkedHashMap<String, List<String>>()
}

allprojects {
    group = project.maven_group

    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'fabric-loom'
    apply plugin: 'io.freefair.lombok'

    repositories {
        maven {
            url "https://repo.lclpnet.work/repository/internal"
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        compileOnly 'org.jetbrains:annotations:24.1.0'

        testImplementation("org.junit.jupiter:junit-jupiter-api:5.8.1")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.8.1")
        testImplementation("org.mockito:mockito-core:5.6.0")
        testImplementation("org.junit.jupiter:junit-jupiter-params:5.8.1")
        testImplementation("net.fabricmc:fabric-loader-junit:${project.loader_version}")
    }

    test {
        useJUnitPlatform()
        systemProperty("fabric.side", "server")
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(project.java_version)
        targetCompatibility = JavaVersion.toVersion(project.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release.set(Integer.valueOf(project.java_version as String) as int)
    }

    [jar, sourcesJar].each {
        it.from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}"}
        }
    }

    publishing {
        // automatically use DEPLOY_URL, DEPLOY_USER and DEPLOY_PASSWORD environment variables
        // or mavenHost, mavenUser and mavenPassword from props
        buildUtils.setupPublishRepository(repositories, props)
    }
}

subprojects {
    version = getSubprojectVersion(project)

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = project.archivesBaseName

                from components.java
            }
        }
    }

    base {
        archivesName = project.name
    }

    configureSubstitutions(processResources, substitutions(it))

    publishMavenJavaPublicationToMavenRepository.onlyIf {
        return !checkProjectIsDeployed(project, props)
    }

    afterEvaluate {
        tasks.find { (it.name == "genSources") }?.setEnabled(false)
        tasks.find { (it.name == "genSourcesWithCfr") }?.setEnabled(false)
        tasks.find { (it.name == "genSourcesWithFernFlower") }?.setEnabled(false)
        tasks.find { (it.name == "genSourcesWithVineflower") }?.setEnabled(false)
    }
}

subprojects {
    apply from: 'build.gradle'

    def kibuModules = ext.properties.get("kibuModules", []) as List<String>
    def gacoModules = ext.properties.get("gacoModules", []) as List<String>

    def projectKibuModules = rootProject.ext.properties.projectKibuModules as Map<String, List<String>>
    def projectGacoModules = rootProject.ext.properties.projectGacoModules as Map<String, List<String>>

    projectKibuModules.put(it.name, kibuModules)
    projectGacoModules.put(it.name, gacoModules)

    useKibuModules(it, kibuModules)
}

subprojects {
    def projectKibuModules = rootProject.ext.properties.get("projectKibuModules", []) as Map<String, List<String>>
    def projectGacoModules = rootProject.ext.properties.get("projectGacoModules", []) as Map<String, List<String>>

    def transitiveKibuModules = new HashSet<String>()
    def transitiveGacoModules = new HashSet<String>()
    def processGacoModules = new ArrayList<>(projectGacoModules.get(it.name, []))

    while (!processGacoModules.isEmpty()) {
        def gacoModule = processGacoModules.removeFirst()

        if (it.name == gacoModule) {
            throw new IllegalStateException("Gaco module $gacoModule cannot depend on itself")
        }

        if (!transitiveGacoModules.add(gacoModule)) continue

        def kibuModules = projectKibuModules.get(gacoModule, [])
        transitiveKibuModules.addAll(kibuModules)

        def gacoNext = projectGacoModules.get(gacoModule, [])

        for (final def next in gacoNext) {
            if (it.name == next) {
                throw new IllegalStateException("Circular dependency detected for gaco module $it.name (via $gacoModule)")
            }

            if (transitiveGacoModules.contains(next)) continue

            processGacoModules.add(next)
        }
    }

    useKibuModules(it, transitiveKibuModules)
    useGacoModules(it, transitiveGacoModules)
}

base {
    archivesName = project.archives_base_name
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.getOutput()
        runtimeClasspath += main.runtimeClasspath + main.getOutput()
    }
}

subprojects {
    rootProject.sourceSets.testmod.runtimeClasspath += it.sourceSets.main.runtimeClasspath
}

loom {
    serverOnlyMinecraftJar()

    runs {
        remove client

        named('server') {
            source 'testmod'
        }
    }
}

configureSubstitutions(processResources, substitutions(project))
configureSubstitutions(processTestmodResources, substitutions(project))

dependencies {
    afterEvaluate {
        subprojects.each {
            api project(path: it.path, configuration: "namedElements")
        }
    }
}

// add subprojects as nested jar to the main jar
remapJar {
    afterEvaluate {
        subprojects.each {
            nestedJars.from project(it.path).tasks.named("remapJar")
        }
    }
}

tasks.register("github", GithubDeploymentTask) {
    dependsOn tasks.remapJar

    config {
        token = env.get("GITHUB_TOKEN")
        repository = env.get("GITHUB_REPOSITORY")
    }

    release {
        title = "[$project.minecraft_version] $project.name $project.version"
        tag = project.version
    }

    assets.add(tasks.remapJar.archiveFile.get())
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            pom {
                name = 'gaco'
                description = 'Game commons libraries for developing minigames for Minecraft: Java edition using FabricMC.'
            }
        }
    }
}

/************************************\
 * Utilities                         *
 \************************************/

static def configureSubstitutions(ProcessResources task, Map<String, ?> substitutions) {
    for (def entry in substitutions.entrySet()) {
        task.inputs.property(entry.key, entry.value)
    }

    task.filesMatching("fabric.mod.json") {
        expand substitutions
    }
}

def checkProjectIsDeployed(Project project, Properties props) {
    def url = "${getDeployUrl(props)}/${project.group.toString().replace('.', '/')}/${project.archivesBaseName}/maven-metadata.xml"

    String xml
    try {
        xml = new URL(url).text
    } catch (Throwable ignored) {
        return false
    }

    def meta = new groovy.xml.XmlSlurper().parseText(xml)
    def versions = meta.versioning.versions.version*.text()

    return versions.contains(project.version)
}

def getDeployUrl(Properties props) {
    Map<String, String> env = System.getenv()

    if (env.containsKey("DEPLOY_URL")) {
        return env.get("DEPLOY_URL")
    } else if (props.containsKey('mavenHost')) {
        return props.getProperty('mavenHost')
    } else {
        return "file:///${rootProject.projectDir}/repo"
    }
}

static def getSubprojectVersion(Project project) {
    def version = project.getProperties()["${project.getName()}_version"]

    if (!version) {
        throw new IllegalStateException("Could not find version for project ${project.getName()}")
    }

    boolean local = System.getProperty("build.local") == "true"
    def suffix = (local ? '+local' : '')

    def versionString = version.toString()
    def snapshotSuffix = "-SNAPSHOT"

    if (versionString.endsWith(snapshotSuffix)) {
        return versionString.substring(0, versionString.length() - snapshotSuffix.length()) + "+" + project.minecraft_version + suffix + snapshotSuffix
    }

    return versionString + "+" + project.minecraft_version + suffix
}

def useKibuModules(Project project, Iterable<String> modules) {
    for (final def module in modules) {
        def version = rootProject.getProperties()["${module}_version"]

        if (!version) {
            throw new IllegalStateException("Could not find version for kibu module $module")
        }

        project.dependencies {
            modImplementation("work.lclpnet.mods.kibu:$module:$version")
        }
    }
}

def useGacoModules(Project project, Iterable<String> modules) {
    for (final def module in modules) {
        project.dependencies {
            api project.dependencies.project(path: ":$module", configuration: 'namedElements')
        }
    }
}
